  <h3 id="textoErro"></h3> 
  <div class="ContainerEmail" id="containerEmail">

      <div class="login">
        <div class="loginhead">
          <img class="logo" src="\assets\img\YG Logo.png" alt="">
          <h1>Bem-vindo novamente!</h1>
        </div>
        <label for="exemploInpuEmail" class="formLabel">Digite o seu email</label>

      <div class="container-senha">
        <label for="exemploSenha" class="formLabel">Senha</label>
        <input type="password" class="formControl" id="exemploInputSenha">
      </div>
      <div class="caixaSelecao">
        <input type="checkbox" class="botaoSelecao" id="botaoSelecao">
        <label class="textoSelecao" for="exemploCheckbox">Lembrar-me</label>
      </div>
      <button onclick="login()" type="submit" class="botaoLoginar">Entrar</button>
