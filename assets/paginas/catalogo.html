<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">  
  <link rel="stylesheet" href="/assets/css/catalogue.css">
  <title>Home</title>
</head>

<body>

  <div class="links">
    <div class="marca">Young Games®️</div>
    <nav>
      <a href="/index.html"><img class="iconeLogin" id="imgLogin" src="/assets/img/door-open-svgrepo-com.svg" alt="">
        Login</a>
        <a href="/assets/paginas/catalogo.html"><img class="iconeCatalogo" id="imgCatalogo" src="\assets\img\rectangle-grid-2x2-svgrepo-com.svg" alt=""> Catálogo</a>
      <a href="/assets/paginas/cart.html"><img class="iconeCarrirrinho" id="imgCarrinho"
          src="/assets/img/cart-shopping-svgrepo-com.svg" alt=""> Carrinho</a>
    </nav>
  </div>
  
  <header class="Cabeçario">
    <h1>Sejá <span>Criativo</span></h1>
    <h2>Milhares de jogos a sua disposição</h2>
  </header>

  <main class="conteinerCarrosel">
    <section class="carrosel-secao">
      <h3 class="carroselTitulo">Novidades para Você</h3>
      <div class="carrosel Noticias">
        <button class="carrosel-btn left"><i class="fas fa-chevron-left"></i></button>
        <div class="carrosel-container">
          <div class="carrossel" id="noticias-carrossel">
            <!-- Itens serão adicionados dinamicamente -->
          </div>
        </div>
        <button class="carrosel-btn right"><i class="fas fa-chevron-right"></i></button>
      </div>
    </section>

    <section class="carrosel-secao">
      <h3 class="carroselTitulo">Produtos em Alta</h3>
      <div class="carrosel potência">
        <button class="carrosel-btn left"><i class="fas fa-chevron-left"></i></button>
        <div class="carrosel-container">
          <div class="carrossel" id="potencial-carrossel">
            <!-- Itens serão adicionados dinamicamente -->
          </div>
        </div>
        <button class="carrosel-btn right"><i class="fas fa-chevron-right"></i></button>
      </div>
    </section>

    <section class="carrosel-secao">
      <h3 class="carroselTitulo">Jogos Clássicos</h3>
      <div class="carrosel Populares">
        <button class="carrosel-btn left"><i class="fas fa-chevron-left"></i></button>
        <div class="carrosel-container">
          <div class="carrossel" id="populares-carrossel">
            <!-- Itens serão adicionados dinamicamente -->
          </div>
        </div>
        <button class="carrosel-btn right"><i class="fas fa-chevron-right"></i></button>
      </div>
    </section>
  </main>

  <script>
    const API_KEY = '8f678949e8554b28973aa62d271d1f3d';
    const coversCache = new Map();
    
    // Tipos de carrosséis e suas configurações
    const carrosselsConfig = {
      'noticias': { count: 15, elementId: 'noticias-carrossel' },
      'potencial': { count: 15, elementId: 'potencial-carrossel' },
      'populares': { count: 15, elementId: 'populares-carrossel' }
    };
    
    // Inicializa todos os carrosséis quando a página carrega
    document.addEventListener('DOMContentLoaded', async () => {
      try {
        // Carrega jogos para cada carrossel
        for (const [type, config] of Object.entries(carrosselsConfig)) {
          const games = await fetchRandomGames(config.count);
          populateCarrossel(config.elementId, games);
          setupCarrosselNavigation(config.elementId);
        }
      } catch (error) {
        console.error('Erro ao carregar jogos:', error);
      }
    });
    
    // Preenche um carrossel com os jogos
    function populateCarrossel(elementId, games) {
      const carrossel = document.getElementById(elementId);
      
      games.forEach(game => {
        const item = document.createElement('div');
        item.className = 'carrosel-item';
        
        const img = document.createElement('img');
        img.src = game.background_image || 'https://via.placeholder.com/200x250?text=Sem+Imagem';
        img.alt = `Capa de ${game.name}`;
        
        const title = document.createElement('h4');
        title.textContent = game.name;
        
        item.appendChild(img);
        item.appendChild(title);
        carrossel.appendChild(item);
      });
    }
    
    // Configura a navegação do carrossel
    function setupCarrosselNavigation(elementId) {
      const carrossel = document.getElementById(elementId);
      const container = carrossel.parentElement;
      const leftBtn = container.previousElementSibling;
      const rightBtn = container.nextElementSibling;
      
      let currentPosition = 0;
      const itemWidth = 220; // Largura aproximada de cada item (200px + gap)
      
      leftBtn.addEventListener('click', () => {
        currentPosition = Math.min(currentPosition + itemWidth * 3, 0);
        carrossel.style.transform = `translateX(${currentPosition}px)`;
      });
      
      rightBtn.addEventListener('click', () => {
        const maxScroll = -(carrossel.scrollWidth - container.clientWidth);
        currentPosition = Math.max(currentPosition - itemWidth * 3, maxScroll);
        carrossel.style.transform = `translateX(${currentPosition}px)`;
      });
    }
    
    // Função para buscar jogos aleatórios
    async function fetchRandomGames(count = 10) {
      const cacheKey = `games_${count}`;
      
      if (coversCache.has(cacheKey)) {
        return coversCache.get(cacheKey);
      }
      
      const currentDate = new Date().toISOString().split('T')[0];
      const threeMonthsAgo = new Date();
      threeMonthsAgo.setMonth(threeMonthsAgo.getMonth() - 3);
      const formattedDate = threeMonthsAgo.toISOString().split('T')[0];
      
      const response = await fetch(
        `https://api.rawg.io/api/games?key=${API_KEY}&dates=${formattedDate},${currentDate}&page_size=${count}`
      );
      
      if (!response.ok) {
        throw new Error(`Erro na requisição: ${response.status}`);
      }
      
      const data = await response.json();
      
      if (!data.results || data.results.length === 0) {
        throw new Error('Nenhum jogo encontrado');
      }
      
      coversCache.set(cacheKey, data.results);
      setTimeout(() => coversCache.delete(cacheKey), 300000);
      
      return data.results;
    }
  </script>
</body>
</html>
